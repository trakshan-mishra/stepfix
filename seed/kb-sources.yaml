# Knowledge-base source allowlist — the ingest script only fetches what's listed here.
# license: what applies to the text; use: ingest (chunks stored + shown with attribution) | link-only (never stored)
# Verify each license on the source before the first ingest; record the date you checked.

sources:
  - id: archwiki-bluetooth
    url: https://wiki.archlinux.org/title/Bluetooth
    license: GFDL-1.3-or-later
    use: ingest
    os: [linux, ubuntu, debian]
    category: [bluetooth]
    attribution: "ArchWiki contributors, GNU FDL 1.3 or later"
    notes: Arch-specific package names (pacman) — ingest for concepts/diagnostics, never copy install commands into the library.

  - id: archwiki-networkmanager
    url: https://wiki.archlinux.org/title/NetworkManager
    license: GFDL-1.3-or-later
    use: ingest
    os: [linux, ubuntu, debian]
    category: [wifi]
    attribution: "ArchWiki contributors, GNU FDL 1.3 or later"

  - id: archwiki-wireless
    url: https://wiki.archlinux.org/title/Network_configuration/Wireless
    license: GFDL-1.3-or-later
    use: ingest
    os: [linux, ubuntu, debian]
    category: [wifi, bluetooth]
    attribution: "ArchWiki contributors, GNU FDL 1.3 or later"
    notes: Covers rfkill and firmware — useful for the S03 escalation report.

  - id: ms-support-articles
    url: https://github.com/MicrosoftDocs/SupportArticles-docs
    license: CC-BY-4.0 (docs), MIT (code)
    use: ingest
    os: [windows11, windows10]
    category: [wifi, bluetooth, system]
    attribution: "Microsoft, CC BY 4.0"
    notes: Clone the repo; filter to Windows client networking/Bluetooth articles. Check how much Windows-client coverage exists — the repo is broad (Exchange, M365, Teams, Windows deployment/updates…).

  - id: ms-learn-powershell-pnp-netadapter
    url: https://learn.microsoft.com/en-us/powershell/module/pnpdevice/get-pnpdevice
    license: CC-BY-4.0 (verify on the page footer / MicrosoftDocs repo)
    use: link-only
    os: [windows11, windows10]
    category: [bluetooth, wifi]
    notes: Use as sources on library entries.

  - id: github-docs
    url: https://github.com/github/docs
    license: CC-BY-4.0 (content), MIT (code)
    use: ingest
    os: [windows11, windows10, ubuntu, debian, linux_other]
    category: [dev_cli]
    attribution: "GitHub, CC BY 4.0"
    notes: Only if you add git/gh troubleshooting; skip for MVP otherwise.

  - id: npm-docs
    url: https://docs.npmjs.com/resolving-eacces-permissions-errors-when-installing-packages-globally
    license: verify
    use: link-only
    category: [dev_cli]

  - id: nodejs-docs
    url: https://nodejs.org/en/download
    license: verify
    use: link-only
    category: [dev_cli]

  - id: ubuntu-help
    url: https://help.ubuntu.com/
    license: verify (desktop guide is believed to be CC BY-SA; confirm before ingesting)
    use: link-only
    os: [ubuntu]
    category: [bluetooth, wifi]

  - id: claude-code-docs
    url: https://code.claude.com/docs
    license: proprietary
    use: link-only
    category: [dev_cli]
    notes: Never ingest. Link from manual entries ("see the official troubleshooting page").

  - id: vendor-support-pages
    url: "(HP, Dell, Lenovo, Apple support sites)"
    license: proprietary
    use: link-only
    notes: Never scrape. A company customer would give you its own docs under agreement (v2 widget).
